name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-frontend:
    name: Frontend → GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true

  deploy-backend:
    name: Backend → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render redeploy
        run: |
          SERVICE="${{ secrets.RENDER_SERVICE_ID }}"
          KEY="${{ secrets.RENDER_API_KEY }}"
          if [ -n "$SERVICE" ] && [ -n "$KEY" ]; then
            curl -sf -X POST \
              "https://api.render.com/v1/services/${SERVICE}/deploys" \
              -H "Authorization: Bearer ${KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": false}' && echo "Render deploy triggered"
          else
            echo "Render secrets not configured — skipping backend deploy"
          fi
